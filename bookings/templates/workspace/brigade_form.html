{% extends "workspace/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
    <h1>{{ title }}</h1>
    <nav class="pagination" aria-label="Stammdatenaktionen">
        <a href="{% url 'brigades' %}">Zurück zu den Feuerwehren</a>
    </nav>
    <section class="panel" aria-label="Stammdaten">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Speichern</button>
        </form>
    </section>
{% endblock %}
