<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Übersicht{% endblock %} · BMS</title>
    <style>
        {% include "mailimport/preview.css" %}
        {% include "workspace/workspace.css" %}
        {% block page_styles %}{% endblock %}
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Zum Inhalt</a>
    <header class="app-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'overview' %}"><strong>BMS</strong><span>Lehrgangsverwaltung</span></a>
            <span class="mode">Testbetrieb</span>
        </div>
    </header>
    {% include "workspace/navigation.html" %}
    <main id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
